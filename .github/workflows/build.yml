name: build

# Builds every example and extra of this JUCE 7 fork, runs the unit tests and
# smoke-launches DemoRunner and AudioPluginHost on each supported platform.

on:
  push:
    branches: ["juce7-*"]
    tags: ["7.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: win-x64,     os: windows-2025 }
          - { name: macos-arm64, os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - name: install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build xvfb \
            libasound2-dev libjack-jackd2-dev ladspa-sdk libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libglu1-mesa-dev mesa-common-dev

      - name: configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then generator=(-A x64); else generator=(-G Ninja); fi
          cmake -S . -B build "${generator[@]}" -DCMAKE_BUILD_TYPE=Release -DJUCE_BUILD_EXAMPLES=ON -DJUCE_BUILD_EXTRAS=ON

      - name: build
        run: cmake --build build --config Release --parallel

      - name: unit tests
        shell: bash
        run: |
          runner=$(find build/extras/UnitTestRunner -type f \( -name UnitTestRunner -o -name UnitTestRunner.exe \) | head -1)
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run -a "$runner" --seed=0x1234; else "$runner" --seed=0x1234; fi

      - name: smoke-launch apps
        shell: bash
        run: |
          set -u
          for app in DemoRunner AudioPluginHost; do
            exe=$(find build -type f \( -path "*${app}_artefacts*/${app}" -o -path "*${app}_artefacts*/${app}.exe" \) | head -1)
            echo "launching $exe"
            if [ "$RUNNER_OS" = "Linux" ]; then
              xvfb-run -a "$exe" & pid=$!
            else
              "$exe" & pid=$!
            fi
            sleep 20
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid"; echo "$app exited early with code $?"; exit 1
            fi
            echo "$app still running after 20s"
            kill "$pid" 2>/dev/null || true
            if [ "$RUNNER_OS" = "Windows" ]; then taskkill //F //IM "$app.exe" >/dev/null 2>&1 || true; fi
            if [ "$RUNNER_OS" = "Linux" ]; then pkill -f "$exe" || true; fi
          done
